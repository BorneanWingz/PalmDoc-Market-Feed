name: Update MPOB CPO Price

on:
  schedule:
    # 08:31 and 16:31 Malaysia time (UTC+8). GitHub often starts scheduled runs hours late or drops them,
    # so backup runs follow; they only commit when the price has changed.
    - cron: '31 0 * * *'
    - cron: '31 2 * * *'
    - cron: '31 4 * * *'
    - cron: '31 8 * * *'
    - cron: '31 10 * * *'
    - cron: '31 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh latest CPO JSON
        run: node scripts/fetch-cpo-price.mjs

      - name: Commit and push update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/cpo-latest.json market/cpo-history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update MPOB CPO price"
            git push
          fi
